name: Middleware integration (DI 6)

on:
  push:
    branches:
      - fix/middleware-security-audit
    paths:
      - 'src/**'
      - 'integration/**'
      - 'composer.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/di
          ref: e203077d12048936f078d37d1cf3badd661e1716
          path: integration-deps/di
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-csrf-middleware
          ref: cbec1c34065de996f20307ce1103169f77420837
          path: integration-deps/http-csrf-middleware
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-cors-middleware
          ref: c0064ae459dc0706e2e2d798644c64c5d7489290
          path: integration-deps/http-cors-middleware
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-throttle-middleware
          ref: 4c6ec261969a4f8d1df75250ceb10be38527bfeb
          path: integration-deps/http-throttle-middleware
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-trusted-proxy-middleware
          ref: 2ce4d7061b9c5e4fc35d86a0e49731a2c20eee07
          path: integration-deps/http-trusted-proxy-middleware
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, ctype
          tools: composer:2.9.8@sha256:59b2c50e10cafa0d8efc19ede9a326d782f096c674a26baf98cf042ce23de890
      - run: composer update --working-dir=integration --no-interaction --prefer-dist --no-progress
      - run: composer audit --working-dir=integration
      - run: php integration/smoke.php
